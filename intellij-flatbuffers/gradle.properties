# Plugin coordinates and IDE target. Tweak `platformVersion` to widen the
# IDE compatibility band — it must stay within the `sinceBuild`..`untilBuild`
# range expressed in plugin.xml. The Marketplace rejects uploads whose
# compatibility band falls below the lowest IDE the user has installed.
#
# Why `intellijIdeaCommunity` as the build base rather than Rider: the
# Community SDK is the smallest superset that exposes
# `AsyncDocumentFormattingService` + the Lexer/SyntaxHighlighter APIs we
# need; the resulting plugin still runs on Rider, IDEA Ultimate, WebStorm,
# PyCharm, GoLand, CLion, RustRover, etc. because all of them embed the
# same `com.intellij.modules.platform`. Building against Community keeps
# the dev download under 1 GB.

pluginGroup = io.github.emindeniz99
pluginName = intellij-flatbuffers
# x-release-please-start-version
pluginVersion = 0.1.0
# x-release-please-end

# IntelliJ Platform 2024.2 = build 242. AsyncDocumentFormattingService has
# been stable since 222 (2022.2) but 242 is what the Marketplace currently
# considers "supported" and what Rider 2024.2 ships.
platformType = IC
platformVersion = 2024.2

# GitHub repository the plugin downloads its engine binary from. Lives here
# rather than in Kotlin so moving the project to another repo is a one-line
# change (see the generateEngineVersion task in build.gradle.kts).
pluginRepository = emindeniz99/playground

# JVM Gradle/Kotlin compile target. IntelliJ 2024.2 bundles JBR 21, so
# targeting 21 is the modern default; bump only when the platform does.
javaVersion = 21

# Gradle version the CI-generated wrapper pins to. Consumed by the `wrapper`
# task in build.gradle.kts, so the workflows just run `gradle wrapper` and
# this literal lives in exactly one place.
gradleVersion = 9.5.1

# Gradle hygiene
org.gradle.jvmargs = -Xmx2g -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching = true
kotlin.stdlib.default.dependency = false
