# mise — https://mise.jdx.dev/
#
# Polyglot version manager. Coexists with the sibling .nvmrc:
# mise reads .nvmrc natively, but this file is the source of truth
# for mise users and the place to pin additional tools if we ever
# need to (Python for some bench/audit scripts, flatc, etc.).
#
# Quickstart for contributors using mise:
#   mise trust            # one-time, allows this file's pins
#   mise install          # installs every tool listed below
#   # `cd`ing into projects/flatbuffers/ now auto-switches versions
#
# Why duplicate the Node pin between .nvmrc and here:
# nvm / fnm / volta / asdf consumers see .nvmrc; mise users see this.
# Both must agree; bump both in the same commit when changing versions.

[tools]
node = "22"
