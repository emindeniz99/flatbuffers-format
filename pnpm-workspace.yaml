# pnpm workspace manifest for the FlatBuffers project family.
#
# This workspace lives at the repo root. Every npm-managed FlatBuffers
# package is an immediate subfolder of this directory.
#
# Why include the private `flatbuffers-formatter-handrolled`: it's a
# workspace member so its `workspace:` deps (none today, but room for
# future) resolve cleanly, and so `pnpm -r run test` exercises it
# alongside the published packages.

packages:
  - "*"
# Lifecycle-script allowlist (pnpm 11 home of package.json's former
# pnpm.onlyBuiltDependencies): the packages we actively build/test/
# publish with; everything else stays sandboxed.
allowBuilds:
  '@vscode/vsce-sign': true
  tree-sitter-cli: true
  # Explicitly NOT built. `tree-sitter` is an OPTIONAL PEER of
  # tree-sitter-flatbuffers (consumers supply the runtime), and nothing in
  # this workspace imports it. Its native build wants a C++20 toolchain
  # that Node 24+ headers require but its binding.gyp never requests, so
  # building it here only broke the 24/26 matrix legs. Consumers build it
  # against their own Node; the packed-tarball job covers that path.
  tree-sitter: false
  # Explicitly NOT built. esbuild's postinstall only validates and relinks
  # the platform binary; its JS API resolves @esbuild/<platform>/bin/esbuild
  # directly, so the vscode-flatbuffers bundle step works with the script
  # blocked. Without an explicit entry pnpm 11 fails the whole workspace
  # with ERR_PNPM_IGNORED_BUILDS — an error, not a warning.
  esbuild: false
# Security floor for a transitive dev-only dependency: monaco-editor
# 0.57 pins dompurify 3.4.15 exactly (GHSA-6688-9rhm-gjv2 and
# GHSA-p98j-92pf-mc4p, fixed in 3.4.16). It never ships in a published
# package; drop the entry once monaco's own pin moves past the fix.
overrides:
  dompurify: ^3.4.16
