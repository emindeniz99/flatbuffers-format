# PR-time validation for the IntelliJ plugin. Runs on every push to a
# PR that touches the plugin sources (or this workflow), plus on
# pushes to `main`. Mirrors the per-project CI workflows for the four
# npm/Marketplace packages.
#
# Three checks:
#   1. `./gradlew buildPlugin` — full build, produces the .zip artifact
#      the release workflow will later upload.
#   2. `./gradlew test` — JUnit + IntelliJ-platform test fixture.
#   3. `./gradlew verifyPlugin` — IntelliJ Plugin Verifier runs the
#      plugin's classes through every recommended IDE build and
#      reports compatibility/API-usage issues. The Marketplace runs
#      the same check at upload time; failing here gives us a fast
#      red signal locally.

name: intellij-flatbuffers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - intellij-flatbuffers/**
      - .github/workflows/intellij-flatbuffers.yml
  pull_request:
    paths:
      - intellij-flatbuffers/**
      - .github/workflows/intellij-flatbuffers.yml

permissions:
  contents: read

jobs:
  build:
    name: build + verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intellij-flatbuffers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The plugin now SHIPS the engine as a JS bundle
      # (engine/flatbuffers-format.cjs) so most users need no download.
      # esbuild builds that bundle from flatbuffers-formatter/dist/, which
      # is gitignored — so without these steps Gradle's bundleEngineJs has
      # nothing to bundle. buildPlugin would warn and skip; publishPlugin
      # hard-fails rather than shipping a plugin with no engine.
      # No `working-directory` on the `uses:` steps — GitHub rejects the
      # whole file for that.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build the formatter engine the plugin bundles
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter flatbuffers-format build
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Generate the wrapper on-the-fly so we don't have to check in
      # gradle-wrapper.jar (binary jars in source are a maintenance smell).
      # The version comes from gradle.properties via the `wrapper` task,
      # so it is not repeated here. `gradle wrapper` is idempotent.
      - name: Generate Gradle wrapper
        run: gradle wrapper
      - name: Build plugin
        run: ./gradlew --no-daemon buildPlugin
      - name: Test
        run: ./gradlew --no-daemon test
      - name: Verify plugin
        run: ./gradlew --no-daemon verifyPlugin
      - name: Upload plugin .zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intellij-flatbuffers-plugin
          path: intellij-flatbuffers/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30
