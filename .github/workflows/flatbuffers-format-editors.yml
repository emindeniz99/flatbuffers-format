# Per-package CI for flatbuffers-format-editors. Installs the whole
# pnpm workspace (so the workspace:^ engine dep is hoisted), then
# builds + lints + tests this package.

name: flatbuffers-format-editors

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - flatbuffers-formatter/**
      - flatbuffers-format-editors/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/flatbuffers-format-editors.yml
  pull_request:
    paths:
      - flatbuffers-formatter/**
      - flatbuffers-format-editors/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/flatbuffers-format-editors.yml

permissions:
  contents: read

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Build engine + editors
        working-directory: .
        run: pnpm --filter flatbuffers-format --filter flatbuffers-format-editors build
      - name: Lint
        working-directory: .
        run: pnpm --filter flatbuffers-format-editors lint
      - name: Test
        working-directory: .
        run: pnpm --filter flatbuffers-format-editors test
