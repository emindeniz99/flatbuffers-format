# Per-package CI for flatbuffers-format-editors. Installs the whole
# pnpm workspace (so the workspace:^ engine dep is hoisted), then
# builds + lints + tests this package.

name: flatbuffers-format-editors

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - projects/flatbuffers/flatbuffers-formatter/**
      - projects/flatbuffers/flatbuffers-format-editors/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/flatbuffers-format-editors.yml
  pull_request:
    paths:
      - projects/flatbuffers/flatbuffers-formatter/**
      - projects/flatbuffers/flatbuffers-format-editors/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/flatbuffers-format-editors.yml

permissions:
  contents: read

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build engine + editors
        run: pnpm --filter flatbuffers-format --filter flatbuffers-format-editors build
      - name: Lint
        run: pnpm --filter flatbuffers-format-editors lint
      - name: Test
        run: pnpm --filter flatbuffers-format-editors test
