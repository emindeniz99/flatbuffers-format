# Per-package CI for flatbuffers-format-editors. Installs the whole
# pnpm workspace (so the workspace:^ engine dep is hoisted), then
# builds + lints + tests this package.

name: flatbuffers-format-editors

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - flatbuffers-formatter/**
      - flatbuffers-format-editors/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/flatbuffers-format-editors.yml
  pull_request:
    paths:
      - flatbuffers-formatter/**
      - flatbuffers-format-editors/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/flatbuffers-format-editors.yml

permissions:
  contents: read

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Build engine + editors
        working-directory: .
        run: pnpm --filter flatbuffers-format --filter flatbuffers-format-editors build
      - name: Lint
        working-directory: .
        run: pnpm --filter flatbuffers-format-editors lint
      - name: Test
        working-directory: .
        run: pnpm --filter flatbuffers-format-editors test

  # The `engines: node >=20` floor, checked on what a consumer installs:
  # the packed engine and editors tarballs, installed with npm next to
  # the CodeMirror peers and loaded on Node 20. The job above cannot run
  # on 20 (pnpm 11 requires Node >=22.13), so packing happens on 22. The
  # Web Component entry extends HTMLElement and needs a browser, so only
  # the CodeMirror and Monaco entries are loaded. Node 20 is end of life
  # since April 2026; it stays supported, and tested, until 2027.
  node20:
    name: packed tarball on node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build engine + editors
        run: pnpm --filter flatbuffers-format --filter flatbuffers-format-editors build
      - name: Pack the engine and the editors
        run: |
          pnpm --filter flatbuffers-format pack --pack-destination "$RUNNER_TEMP/pack"
          pnpm --filter flatbuffers-format-editors pack --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Install into a clean consumer and load # zizmor: ignore[adhoc-packages]
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init -y >/dev/null
          npm install --no-audit --no-fund @codemirror/language @codemirror/state \
            @codemirror/view @lezer/highlight "$RUNNER_TEMP"/pack/*.tgz
          cat > load.mjs <<'JS'
          import { flatbuffers } from "flatbuffers-format-editors/codemirror";
          import { registerFlatBuffers } from "flatbuffers-format-editors/monaco";

          if (!flatbuffers().language) throw new Error("no CodeMirror language");

          let provider;
          const languages = {
            register() {},
            setMonarchTokensProvider() {},
            setLanguageConfiguration() {},
            registerDocumentFormattingEditProvider(_id, p) {
              provider = p;
            },
          };
          registerFlatBuffers({ languages });
          const model = { getValue: () => "table T{x:int;y:string;}", getFullModelRange: () => "all" };
          const [edit] = provider.provideDocumentFormattingEdits(model);
          if (edit?.text !== "table T {\n  x: int;\n  y: string;\n}\n") {
            throw new Error(`unexpected edit: ${JSON.stringify(edit)}`);
          }
          console.log(`loaded on ${process.version}`);
          JS
          node load.mjs
