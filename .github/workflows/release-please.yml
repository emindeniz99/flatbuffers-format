# Release automation for the whole package family.
#
# release-please watches Conventional Commits on main and maintains a
# single release PR (`separate-pull-requests: false`) that bumps every
# package whose scope saw changes. Merging that PR creates one GitHub
# Release per bumped package, tagged `<component>@<version>`, which is
# what wakes the publish jobs below.
#
# npm publishes go through `pnpm publish`, never `npm publish`: the
# packages depend on each other with `workspace:^`, and only pnpm
# rewrites those specs to real version ranges in the tarball. npm would
# ship the literal string and break every installer.
#
# The publish jobs pass `--provenance`, so npm shows a verified-build
# badge linking back to this run — that needs `id-token: write`.
#
# There is deliberately NO npm token. Publishing uses npm's trusted
# publishing (OIDC): the packages are configured to trust this repo and
# this workflow file, and the registry exchanges the job's OIDC token for
# short-lived publish rights. `npm access set mfa=publish` additionally
# disallows tokens on these packages, so a leaked token is worthless.
# Native `pnpm publish` is what reaches the OIDC path — the broken route
# reported upstream is `changeset publish`, which spawns `npm publish`.
# This requires pnpm/action-setup >= 6.0.6.
#
# THE FILENAME IS LOAD-BEARING, twice over:
#   * flatbuffers-post-publish-smoke.yml triggers on
#     `workflow_run: workflows: ["release-please"]`.
#   * npm trusted publishing matches the publishing workflow by
#     filename. Renaming this file silently breaks both.

name: release-please

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      flatbuffers_format_released: ${{ steps.release.outputs['flatbuffers-formatter--release_created'] }}
      flatbuffers_format_tag_name: ${{ steps.release.outputs['flatbuffers-formatter--tag_name'] }}
      prettier_plugin_released: ${{ steps.release.outputs['prettier-plugin-flatbuffers--release_created'] }}
      tree_sitter_released: ${{ steps.release.outputs['tree-sitter-flatbuffers--release_created'] }}
      vscode_released: ${{ steps.release.outputs['vscode-flatbuffers--release_created'] }}
      vscode_tag_name: ${{ steps.release.outputs['vscode-flatbuffers--tag_name'] }}
      intellij_released: ${{ steps.release.outputs['intellij-flatbuffers--release_created'] }}
      intellij_tag_name: ${{ steps.release.outputs['intellij-flatbuffers--tag_name'] }}
      editors_released: ${{ steps.release.outputs['flatbuffers-format-editors--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-flatbuffers-format:
    name: npm publish flatbuffers-format
    needs: release-please
    if: needs.release-please.outputs.flatbuffers_format_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          # No dependency cache in a publishing job: a poisoned restore
          # would become the published artifact. setup-node v7 auto-caches
          # whenever package.json has `packageManager`, so it must be turned
          # off explicitly — dropping `cache:` alone is not enough.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter flatbuffers-format build
      # Local dry-run equivalent:
      #   pnpm --filter flatbuffers-format publish --dry-run --no-git-checks --provenance --access public
      - name: Publish to npm with provenance
        run: pnpm --filter flatbuffers-format publish --no-git-checks --provenance --access public

  publish-prettier-plugin-flatbuffers:
    name: npm publish prettier-plugin-flatbuffers
    needs: release-please
    if: needs.release-please.outputs.prettier_plugin_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          # No dependency cache in a publishing job: a poisoned restore
          # would become the published artifact. setup-node v7 auto-caches
          # whenever package.json has `packageManager`, so it must be turned
          # off explicitly — dropping `cache:` alone is not enough.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install (workspace)
        run: pnpm install --frozen-lockfile
      - name: Build engine + plugin
        run: pnpm --filter flatbuffers-format --filter prettier-plugin-flatbuffers build
      # pnpm publish natively rewrites `workspace:^` to the actual
      # `^X.Y.Z` range in the published tarball; the source on disk
      # keeps the `workspace:^` spec. No manual rewrite step required.
      - name: Publish to npm with provenance
        run: pnpm --filter prettier-plugin-flatbuffers publish --no-git-checks --provenance --access public

  publish-tree-sitter-flatbuffers:
    name: npm publish tree-sitter-flatbuffers
    needs: release-please
    if: needs.release-please.outputs.tree_sitter_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          # No dependency cache in a publishing job: a poisoned restore
          # would become the published artifact. setup-node v7 auto-caches
          # whenever package.json has `packageManager`, so it must be turned
          # off explicitly — dropping `cache:` alone is not enough.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install (workspace)
        run: pnpm install --frozen-lockfile
      # `src/parser.c` is already committed; `prepublishOnly`
      # regenerates it from grammar.js + runs the corpus tests.
      - name: Publish to npm with provenance
        run: pnpm --filter tree-sitter-flatbuffers publish --no-git-checks --provenance --access public

  publish-flatbuffers-format-editors:
    name: npm publish flatbuffers-format-editors
    needs: release-please
    if: needs.release-please.outputs.editors_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          # No dependency cache in a publishing job: a poisoned restore
          # would become the published artifact. setup-node v7 auto-caches
          # whenever package.json has `packageManager`, so it must be turned
          # off explicitly — dropping `cache:` alone is not enough.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install (workspace)
        run: pnpm install --frozen-lockfile
      - name: Build engine + editors
        run: pnpm --filter flatbuffers-format --filter flatbuffers-format-editors build
      # pnpm publish rewrites `workspace:^` (in both peerDependencies
      # and devDependencies) to the resolved `^X.Y.Z` range in the
      # tarball. No manual rewrite step needed.
      - name: Publish to npm with provenance
        run: pnpm --filter flatbuffers-format-editors publish --no-git-checks --provenance --access public

  publish-vscode-flatbuffers:
    name: Marketplace publish vscode-flatbuffers
    needs: release-please
    if: needs.release-please.outputs.vscode_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Fail fast if VSCE_PAT secret is missing
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is not configured. Create an"
            echo "::error::Azure DevOps PAT with Marketplace 'Manage' scope at"
            echo "::error::https://dev.azure.com/<org>/_usersSettings/tokens and add"
            echo "::error::it as a repository secret. See:"
            echo "::error::https://code.visualstudio.com/api/working-with-extensions/publishing-extension#get-a-personal-access-token"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          # No dependency cache in a publishing job: a poisoned restore
          # would become the published artifact. setup-node v7 auto-caches
          # whenever package.json has `packageManager`, so it must be turned
          # off explicitly — dropping `cache:` alone is not enough.
          package-manager-cache: false
      - name: Install (workspace)
        run: pnpm install --frozen-lockfile
      - name: Build engine + extension
        run: pnpm --filter flatbuffers-format --filter vscode-flatbuffers build
      # vsce doesn't understand `workspace:^`, so we materialise a
      # standalone deploy tree (with workspace deps resolved to real
      # version ranges) via `pnpm deploy`, then run vsce against that
      # tree. The source on disk keeps `workspace:^` — deploy/ is a
      # disposable build artefact.
      - name: Materialise deploy tree (pnpm deploy)
        run: |
          rm -rf deploy/vscode
          pnpm deploy --filter vscode-flatbuffers --prod --legacy deploy/vscode
      - name: Package .vsix
        working-directory: deploy/vscode
        run: npx --yes @vscode/vsce package --out vscode-flatbuffers.vsix
      - name: Publish to VS Code Marketplace
        working-directory: deploy/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath vscode-flatbuffers.vsix
      # Open VSX is the Eclipse Foundation registry used by VSCodium,
      # Gitpod, Theia, etc. It's a separate publisher namespace from
      # Marketplace and uses its own token. We treat it as best-effort:
      # if OVSX_PAT is missing or the publish fails, the Marketplace
      # release still stands.
      - name: Publish to Open VSX (optional)
        if: ${{ env.OVSX_PAT != '' }}
        continue-on-error: true
        working-directory: deploy/vscode
        run: npx --yes ovsx publish vscode-flatbuffers.vsix --pat "$OVSX_PAT"
      - name: Upload .vsix to GitHub Release
        if: ${{ needs.release-please.outputs.vscode_tag_name != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCODE_TAG: ${{ needs.release-please.outputs.vscode_tag_name }}
        working-directory: deploy/vscode
        run: gh release upload "$VSCODE_TAG" vscode-flatbuffers.vsix --clobber

  publish-intellij-flatbuffers:
    name: JetBrains Marketplace publish intellij-flatbuffers
    needs: release-please
    if: needs.release-please.outputs.intellij_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # SLSA build-provenance attestation over the plugin .zip and
      # its SHA sidecar. Verifiable via:
      #   gh attestation verify intellij-flatbuffers-X.Y.Z.zip \
      #     --repo emindeniz99/flatbuffers-format
      id-token: write
      attestations: write
    # JOB-LEVEL env var so the optional-signing step's `if:` can read it.
    # `secrets.*` is not directly accessible in `if:` conditions; the
    # standard workaround is to hoist the secret to a job env var and
    # check whether the env var is non-empty.
    env:
      HAS_SIGNING_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY != '' && 'true' || 'false' }}
    defaults:
      run:
        working-directory: intellij-flatbuffers
    steps:
      - name: Fail fast if JETBRAINS_MARKETPLACE_TOKEN is missing
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$JETBRAINS_MARKETPLACE_TOKEN" ]; then
            echo "::error::JETBRAINS_MARKETPLACE_TOKEN secret is not configured."
            echo "::error::Create a 'Plugin Developer' token at"
            echo "::error::https://plugins.jetbrains.com/author/me → Tokens"
            echo "::error::and add it as a repository secret."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The plugin downloads the engine binary from the GitHub Release
      # tagged `flatbuffers-format@<engine version>`. That version is
      # generated from the engine's package.json at build time, so it
      # cannot drift — but the release itself may not exist yet if the
      # engine was never published at that version. Fail here, loudly,
      # rather than shipping a plugin whose download button 404s.
      - name: Assert the engine release exists
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          engine=$(python3 -c 'import json; print(json.load(open("flatbuffers-formatter/package.json"))["version"])')
          tag="flatbuffers-format@${engine}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::The plugin targets engine $engine but no release '$tag' exists."
            echo "::error::Publish the engine first, or the plugin's engine download will 404."
            exit 1
          fi
          echo "engine release $tag exists"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          # This job publishes to the JetBrains Marketplace and attests the
          # .zip it produces, so a poisoned Gradle cache would end up inside
          # a signed, published artifact.
          cache-disabled: true
      # The Gradle wrapper isn't checked in (binary jars don't belong in
      # the repo); we generate it on demand. The version comes from
      # gradle.properties via the `wrapper` task, so it isn't repeated here.
      - name: Generate Gradle wrapper
        run: gradle wrapper
      - name: Build plugin
        run: ./gradlew --no-daemon buildPlugin
      - name: Verify plugin against recommended IDEs
        run: ./gradlew --no-daemon verifyPlugin
      # Signing keys are optional. If they're set, ./gradlew signPlugin
      # produces a signed .zip; if not, publish unsigned (Marketplace
      # allows it, the listing just won't carry a verification badge).
      - name: Sign plugin (optional)
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon signPlugin
      - name: Publish to JetBrains Marketplace
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: ./gradlew --no-daemon publishPlugin
      - name: Emit SHA256 sidecar
        id: zip
        run: |
          set -euo pipefail
          zip_path=$(find build/distributions -name '*.zip' -print -quit)
          if [ -z "$zip_path" ]; then
            echo "::error::No .zip produced under build/distributions/"
            exit 1
          fi
          (cd "$(dirname "$zip_path")" && sha256sum "$(basename "$zip_path")" > "$(basename "$zip_path").sha256")
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "sha_path=$zip_path.sha256" >> "$GITHUB_OUTPUT"
          cat "$zip_path.sha256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            intellij-flatbuffers/${{ steps.zip.outputs.zip_path }}
            intellij-flatbuffers/${{ steps.zip.outputs.sha_path }}
      - name: Upload .zip + sidecar to GitHub Release
        if: ${{ needs.release-please.outputs.intellij_tag_name != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INTELLIJ_TAG: ${{ needs.release-please.outputs.intellij_tag_name }}
          ZIP_PATH: ${{ steps.zip.outputs.zip_path }}
          SHA_PATH: ${{ steps.zip.outputs.sha_path }}
        run: |
          gh release upload "$INTELLIJ_TAG" \
            "$ZIP_PATH" \
            "$SHA_PATH" \
            --clobber
