# Release automation for the whole package family.
#
# release-please watches Conventional Commits on main and maintains a
# single release PR (`separate-pull-requests: false`) that bumps every
# package whose scope saw changes. Merging that PR creates one GitHub
# Release per bumped package, tagged `<component>-v<version>` (the shape
# release-please's `include-component-in-tag` produces with no
# `tag-separator` override), which is what wakes the publish jobs below.
# Tags already exist in that shape — changing the separator now would
# orphan them, so every consumer of the tag string matches `-v`.
#
# npm publishes go through `pnpm publish`, never `npm publish`: the
# packages depend on each other with `workspace:^`, and only pnpm
# rewrites those specs to real version ranges in the tarball. npm would
# ship the literal string and break every installer.
#
# The publish jobs pass `--provenance`, so npm shows a verified-build
# badge linking back to this run — that needs `id-token: write`.
#
# There is deliberately NO npm token. Publishing uses npm's trusted
# publishing (OIDC): the packages are configured to trust this repo and
# this workflow file, and the registry exchanges the job's OIDC token for
# short-lived publish rights. `npm access set mfa=publish` additionally
# disallows tokens on these packages, so a leaked token is worthless.
# Native `pnpm publish` is what reaches the OIDC path — the broken route
# reported upstream is `changeset publish`, which spawns `npm publish`.
# This requires pnpm/action-setup >= 6.0.6.
#
# THE FILENAME IS LOAD-BEARING, twice over:
#   * flatbuffers-post-publish-smoke.yml triggers on
#     `workflow_run: workflows: ["release-please"]`.
#   * npm trusted publishing matches the publishing workflow by
#     filename. Renaming this file silently breaks both.

name: release-please

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      flatbuffers_format_released: ${{ steps.release.outputs['flatbuffers-formatter--release_created'] }}
      flatbuffers_format_tag_name: ${{ steps.release.outputs['flatbuffers-formatter--tag_name'] }}
      prettier_plugin_released: ${{ steps.release.outputs['prettier-plugin-flatbuffers--release_created'] }}
      tree_sitter_released: ${{ steps.release.outputs['tree-sitter-flatbuffers--release_created'] }}
      vscode_released: ${{ steps.release.outputs['vscode-flatbuffers--release_created'] }}
      vscode_tag_name: ${{ steps.release.outputs['vscode-flatbuffers--tag_name'] }}
      intellij_released: ${{ steps.release.outputs['intellij-flatbuffers--release_created'] }}
      intellij_tag_name: ${{ steps.release.outputs['intellij-flatbuffers--tag_name'] }}
      editors_released: ${{ steps.release.outputs['flatbuffers-format-editors--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-flatbuffers-format:
    name: npm publish flatbuffers-format
    needs: release-please
    if: needs.release-please.outputs.flatbuffers_format_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          # No dependency cache in a publishing job: a poisoned restore
          # would become the published artifact. setup-node v7 auto-caches
          # whenever package.json has `packageManager`, so it must be turned
          # off explicitly — dropping `cache:` alone is not enough.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter flatbuffers-format build
      # Local dry-run equivalent:
      #   pnpm --filter flatbuffers-format publish --dry-run --no-git-checks --provenance --access public
      - name: Publish to npm with provenance
        run: pnpm --filter flatbuffers-format publish --no-git-checks --provenance --access public

  publish-prettier-plugin-flatbuffers:
    name: npm publish prettier-plugin-flatbuffers
    needs: release-please
    if: needs.release-please.outputs.prettier_plugin_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          # No dependency cache in a publishing job: a poisoned restore
          # would become the published artifact. setup-node v7 auto-caches
          # whenever package.json has `packageManager`, so it must be turned
          # off explicitly — dropping `cache:` alone is not enough.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install (workspace)
        run: pnpm install --frozen-lockfile
      - name: Build engine + plugin
        run: pnpm --filter flatbuffers-format --filter prettier-plugin-flatbuffers build
      # pnpm publish natively rewrites `workspace:^` to the actual
      # `^X.Y.Z` range in the published tarball; the source on disk
      # keeps the `workspace:^` spec. No manual rewrite step required.
      - name: Publish to npm with provenance
        run: pnpm --filter prettier-plugin-flatbuffers publish --no-git-checks --provenance --access public

  publish-tree-sitter-flatbuffers:
    name: npm publish tree-sitter-flatbuffers
    needs: release-please
    if: needs.release-please.outputs.tree_sitter_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          # No dependency cache in a publishing job: a poisoned restore
          # would become the published artifact. setup-node v7 auto-caches
          # whenever package.json has `packageManager`, so it must be turned
          # off explicitly — dropping `cache:` alone is not enough.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install (workspace)
        run: pnpm install --frozen-lockfile
      # `src/parser.c` is already committed; `prepublishOnly`
      # regenerates it from grammar.js + runs the corpus tests.
      - name: Publish to npm with provenance
        run: pnpm --filter tree-sitter-flatbuffers publish --no-git-checks --provenance --access public

  publish-flatbuffers-format-editors:
    name: npm publish flatbuffers-format-editors
    needs: release-please
    if: needs.release-please.outputs.editors_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          # No dependency cache in a publishing job: a poisoned restore
          # would become the published artifact. setup-node v7 auto-caches
          # whenever package.json has `packageManager`, so it must be turned
          # off explicitly — dropping `cache:` alone is not enough.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install (workspace)
        run: pnpm install --frozen-lockfile
      - name: Build engine + editors
        run: pnpm --filter flatbuffers-format --filter flatbuffers-format-editors build
      # pnpm publish rewrites `workspace:^` (in both peerDependencies
      # and devDependencies) to the resolved `^X.Y.Z` range in the
      # tarball. No manual rewrite step needed.
      - name: Publish to npm with provenance
        run: pnpm --filter flatbuffers-format-editors publish --no-git-checks --provenance --access public

  publish-vscode-flatbuffers:
    name: Marketplace publish vscode-flatbuffers
    needs: release-please
    if: needs.release-please.outputs.vscode_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      # The two registries are independent: Open VSX (Eclipse) needs only
      # an Eclipse account and a token, while the VS Code Marketplace
      # needs an Azure DevOps PAT — which now requires an Azure
      # subscription, and which Microsoft retires on 2026-12-01. So this
      # job publishes to whichever registries have credentials and fails
      # only when NEITHER does. Requiring VSCE_PAT up front would have
      # killed the job before checkout and taken Open VSX down with it.
      - name: Fail fast if no registry token is configured
        run: |
          if [ -z "$VSCE_PAT" ] && [ -z "$OVSX_PAT" ]; then
            echo "::error::Neither VSCE_PAT nor OVSX_PAT is configured, so"
            echo "::error::this release cannot be published anywhere."
            echo "::error::VSCE_PAT  — Azure DevOps PAT, Marketplace 'Manage' scope:"
            echo "::error::  https://code.visualstudio.com/api/working-with-extensions/publishing-extension#get-a-personal-access-token"
            echo "::error::OVSX_PAT  — Open VSX token (no Azure account needed):"
            echo "::error::  https://open-vsx.org/user-settings/tokens"
            exit 1
          fi
          [ -n "$VSCE_PAT" ] || echo "::warning::VSCE_PAT unset — skipping the VS Code Marketplace."
          [ -n "$OVSX_PAT" ] || echo "::warning::OVSX_PAT unset — skipping Open VSX."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          # No dependency cache in a publishing job: a poisoned restore
          # would become the published artifact. setup-node v7 auto-caches
          # whenever package.json has `packageManager`, so it must be turned
          # off explicitly — dropping `cache:` alone is not enough.
          package-manager-cache: false
      - name: Install (workspace)
        run: pnpm install --frozen-lockfile
      - name: Build engine + extension
        run: pnpm --filter flatbuffers-format --filter vscode-flatbuffers build
      # `pnpm deploy` materialises a standalone tree we can run vsce in;
      # the source on disk keeps `workspace:^` and deploy/ is a
      # disposable build artefact. Note what `--legacy` does NOT do: it
      # copies the manifest VERBATIM — `workspace:` specs are not
      # rewritten to real version ranges the way `pnpm publish` rewrites
      # them, so they reach deploy/vscode/package.json intact. That is
      # why the vsce calls below pass `--no-dependencies`: vsce's
      # packaging path shells out to `npm list --production --parseable
      # --depth=99999` and treats a non-zero exit as fatal, and npm exits
      # 1 (ELSPROBLEMS) on a `workspace:` spec it cannot resolve. The
      # extension is bundled into a single file, so there are no runtime
      # dependencies to collect anyway.
      - name: Materialise deploy tree (pnpm deploy)
        run: |
          rm -rf deploy/vscode
          pnpm deploy --filter vscode-flatbuffers --prod --legacy deploy/vscode
      # vsce and ovsx are pinned to exact versions. This job holds
      # VSCE_PAT, OVSX_PAT and a contents:write token, and bare
      # `npx --yes <pkg>` runs whatever `latest` happens to be at job
      # time — including a version published minutes ago, since npx knows
      # nothing about the repo's `minimum-release-age` cooldown (that
      # setting is pnpm-only). Bump these deliberately, and only past the
      # 7-day cooldown .npmrc sets — which is why ovsx sits at 1.0.2
      # rather than the newer 1.1.0.
      - name: Package .vsix
        working-directory: deploy/vscode
        run: npx --yes @vscode/vsce@3.9.2 package --no-dependencies --out vscode-flatbuffers.vsix
      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        working-directory: deploy/vscode
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath vscode-flatbuffers.vsix
      # Open VSX is the Eclipse Foundation registry that VSCodium,
      # Cursor, Windsurf, Gitpod and Theia install from — Microsoft's
      # terms bar those editors from the VS Marketplace, so this is the
      # only channel that reaches them. It has its own namespace and
      # token, unrelated to Azure.
      #
      # Not best-effort. It was `continue-on-error: true` back when the
      # Marketplace was the primary channel and this was a bonus; with
      # the Marketplace gated behind a credential we may not have, a
      # silent Open VSX failure could mean a release that published
      # NOWHERE while the job stayed green.
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        working-directory: deploy/vscode
        run: npx --yes ovsx@1.0.2 publish vscode-flatbuffers.vsix --pat "$OVSX_PAT"
      - name: Upload .vsix to GitHub Release
        if: ${{ needs.release-please.outputs.vscode_tag_name != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCODE_TAG: ${{ needs.release-please.outputs.vscode_tag_name }}
        working-directory: deploy/vscode
        run: gh release upload "$VSCODE_TAG" vscode-flatbuffers.vsix --clobber

  publish-intellij-flatbuffers:
    name: JetBrains Marketplace publish intellij-flatbuffers
    needs: release-please
    if: needs.release-please.outputs.intellij_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # SLSA build-provenance attestation over the plugin .zip and
      # its SHA sidecar. Verifiable via:
      #   gh attestation verify intellij-flatbuffers-X.Y.Z.zip \
      #     --repo emindeniz99/flatbuffers-format
      id-token: write
      attestations: write
    # JOB-LEVEL env var so the publish steps' `if:` can read it — and so
    # the sidecar step below picks the same archive those steps published.
    # `secrets.*` is not directly accessible in `if:` conditions; the
    # standard workaround is to hoist the secret to a job env var and
    # check whether the env var is non-empty.
    env:
      HAS_SIGNING_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY != '' && 'true' || 'false' }}
    defaults:
      run:
        working-directory: intellij-flatbuffers
    steps:
      # `working-directory: .` is load-bearing: this step runs BEFORE
      # actions/checkout, so the job-level `intellij-flatbuffers`
      # default doesn't exist on disk yet and the runner fails to even
      # start bash ("No such file or directory") — before the script
      # body, so the check never runs and the error names the wrong
      # cause. Same reason the assert step below sets it.
      - name: Fail fast if JETBRAINS_MARKETPLACE_TOKEN is missing
        working-directory: .
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$JETBRAINS_MARKETPLACE_TOKEN" ]; then
            echo "::error::JETBRAINS_MARKETPLACE_TOKEN secret is not configured."
            echo "::error::Create a 'Plugin Developer' token at"
            echo "::error::https://plugins.jetbrains.com/author/me → Tokens"
            echo "::error::and add it as a repository secret."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The plugin downloads the engine binary from the GitHub Release
      # tagged `flatbuffers-format-v<engine version>`. That version is
      # generated from the engine's package.json at build time, so it
      # cannot drift — but the release itself may not exist yet if the
      # engine was never published at that version. Fail here, loudly,
      # rather than shipping a plugin whose download button 404s.
      - name: Assert the engine release exists
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          engine=$(python3 -c 'import json; print(json.load(open("flatbuffers-formatter/package.json"))["version"])')
          tag="flatbuffers-format-v${engine}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::The plugin targets engine $engine but no release '$tag' exists."
            echo "::error::Publish the engine first, or the plugin's engine download will 404."
            exit 1
          fi
          echo "engine release $tag exists"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          # This job publishes to the JetBrains Marketplace and attests the
          # .zip it produces, so a poisoned Gradle cache would end up inside
          # a signed, published artifact.
          cache-disabled: true
      # The Gradle wrapper isn't checked in (binary jars don't belong in
      # the repo); we generate it on demand. The version comes from
      # gradle.properties via the `wrapper` task, so it isn't repeated here.
      - name: Generate Gradle wrapper
        run: gradle wrapper
      - name: Build plugin
        run: ./gradlew --no-daemon buildPlugin
      - name: Verify plugin against recommended IDEs
        run: ./gradlew --no-daemon verifyPlugin
      # Signing keys are optional: without them the plugin publishes
      # unsigned (Marketplace allows it, the listing just won't carry a
      # verification badge).
      #
      # There is deliberately NO separate `./gradlew signPlugin` step —
      # the keys must be in the environment of the invocation that
      # PUBLISHES. `publishPlugin` dependsOn `signPlugin` and picks its
      # upload with `signPlugin.didWork ? signedArchiveFile :
      # buildPlugin.archiveFile` (intellij-platform-gradle-plugin 2.16.0,
      # PublishPluginTask.register). `didWork` is a fact about THIS Gradle
      # run, so a separate sign step loses twice: with the keys only on
      # that step, signPlugin's `onlyIf` is false here → skipped → didWork
      # false; with the keys on both, signPlugin is UP-TO-DATE here
      # (signedArchiveFile is an @OutputFile) → didWork false again.
      # Either way the UNSIGNED zip goes to the Marketplace.
      - name: Publish to JetBrains Marketplace (signed)
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon publishPlugin
      # Same command, but the signing vars are OMITTED rather than bound
      # to an unset secret: GitHub would set them to "", and signPlugin's
      # `onlyIf` treats a file property as specified when the resolved
      # path merely exists — an empty path resolves to the project dir,
      # which does. That would switch signing on with nothing to sign
      # with, and fail a publish that is meant to succeed unsigned.
      - name: Publish to JetBrains Marketplace (unsigned)
        if: env.HAS_SIGNING_KEY != 'true'
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: ./gradlew --no-daemon publishPlugin
      # What we hash, attest and attach to the Release must be the exact
      # zip the Marketplace got. With signing on, build/distributions/
      # holds BOTH `<name>-<version>.zip` (buildPlugin) and
      # `<name>-<version>-signed.zip` (signPlugin's signedArchiveFile
      # convention), and publishPlugin uploaded the signed one — so
      # `find … -print -quit`, which returns whatever the directory walk
      # reaches first, can describe a different file than was published.
      # Select by the same rule publishPlugin used, and refuse to guess.
      - name: Emit SHA256 sidecar
        id: zip
        run: |
          set -euo pipefail
          if [ "$HAS_SIGNING_KEY" = 'true' ]; then
            matches=$(find build/distributions -maxdepth 1 -name '*-signed.zip' | sort)
          else
            matches=$(find build/distributions -maxdepth 1 -name '*.zip' -not -name '*-signed.zip' | sort)
          fi
          count=$(printf '%s\n' "$matches" | grep -c '^.' || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one published .zip under build/distributions/ (HAS_SIGNING_KEY=$HAS_SIGNING_KEY), found $count."
            find build/distributions -maxdepth 1 -name '*.zip' >&2 || true
            exit 1
          fi
          zip_path=$matches
          (cd "$(dirname "$zip_path")" && sha256sum "$(basename "$zip_path")" > "$(basename "$zip_path").sha256")
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "sha_path=$zip_path.sha256" >> "$GITHUB_OUTPUT"
          cat "$zip_path.sha256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            intellij-flatbuffers/${{ steps.zip.outputs.zip_path }}
            intellij-flatbuffers/${{ steps.zip.outputs.sha_path }}
      - name: Upload .zip + sidecar to GitHub Release
        if: ${{ needs.release-please.outputs.intellij_tag_name != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INTELLIJ_TAG: ${{ needs.release-please.outputs.intellij_tag_name }}
          ZIP_PATH: ${{ steps.zip.outputs.zip_path }}
          SHA_PATH: ${{ steps.zip.outputs.sha_path }}
        run: |
          gh release upload "$INTELLIJ_TAG" \
            "$ZIP_PATH" \
            "$SHA_PATH" \
            --clobber
