# Build a portable WASI module of `flatbuffers-format` via Javy
# (https://github.com/bytecodealliance/javy) and attach it to GitHub
# Releases. Mirror of `flatbuffers-native-binaries.yml` but the matrix collapses
# to a single artifact — the .wasm is platform-agnostic.
#
# Why a separate workflow:
#   - Different toolchain (Javy, not Node SEA + postject).
#   - Different artifact lifecycle (one universal .wasm vs five
#     platform-specific binaries).
#   - Lets us iterate on the WASM build without rerunning the
#     5-runner Node SEA matrix on every push.

name: wasm-binary

on:
  push:
    branches:
      - main
    paths:
      - projects/flatbuffers/flatbuffers-formatter/src/**
      - projects/flatbuffers/flatbuffers-formatter/grammar/**
      - projects/flatbuffers/flatbuffers-formatter/scripts/build-wasm.mjs
      - .github/workflows/flatbuffers-wasm-binary.yml
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to upload to (e.g. flatbuffers-format@0.1.1)
        required: false
        type: string

permissions:
  contents: write
  # SLSA build-provenance attestations need the OIDC token + the
  # attestations API. See flatbuffers-native-binaries.yml for the consumer-side
  # verification flow.
  id-token: write
  attestations: write

env:
  # Pin Javy. Newer Javy releases occasionally rename CLI flags
  # (`build` ↔ `compile`); pinning means PRs see a stable WASM size +
  # behavior. Bump intentionally with a follow-up PR.
  # Both downloads are checksum-verified — bump each version and its
  # SHA256 in the same commit.
  JAVY_VERSION: v5.0.4
  JAVY_SHA256: e5f329841f42a7ffce9bc1e4226a5e063f40b6cfa1413a8ca762d29df3c08713
  WASMTIME_VERSION: v47.0.3
  WASMTIME_SHA256: ca1fc56d1afc40c8782e96c297fd182a0da162f9a8f52a1e7b094e1dd648e178

jobs:
  build:
    name: build wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/flatbuffers/flatbuffers-formatter
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: projects/flatbuffers/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: projects/flatbuffers/pnpm-lock.yaml
      - name: Install
        working-directory: projects/flatbuffers
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: projects/flatbuffers
        run: pnpm --filter flatbuffers-format build
      # javy compiles the .wasm we publish (attested) to GitHub Releases, so
      # the download is pinned AND checksum-verified — same treatment flatc
      # gets in flatbuffers-ci.yml. When bumping JAVY_VERSION, update
      # JAVY_SHA256 in the same commit (the publisher ships a .sha256
      # sidecar next to the asset).
      - name: Install Javy
        run: |
          set -euo pipefail
          url="https://github.com/bytecodealliance/javy/releases/download/${JAVY_VERSION}/javy-x86_64-linux-${JAVY_VERSION}.gz"
          echo "Downloading $url"
          curl -fsSL "$url" -o javy.gz
          actual_sha=$(sha256sum javy.gz | awk '{print $1}')
          if [ "$actual_sha" != "$JAVY_SHA256" ]; then
            echo "javy checksum mismatch: expected $JAVY_SHA256, got $actual_sha" >&2
            exit 1
          fi
          gunzip javy.gz
          chmod +x javy
          sudo mv javy /usr/local/bin/javy
          javy --version
      - name: Build .wasm
        run: node scripts/build-wasm.mjs
      # Smoke-test the .wasm against the corpus before upload.
      # Pinned + verified release tarball rather than piping install.sh
      # into a shell: this job produces a published, attested artifact, so
      # nothing in it should run unpinned remote code. Bump WASMTIME_VERSION
      # and WASMTIME_SHA256 together.
      - name: Install wasmtime
        run: |
          set -euo pipefail
          asset="wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          url="https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${asset}"
          echo "Downloading $url"
          curl -fsSL "$url" -o wasmtime.tar.xz
          actual_sha=$(sha256sum wasmtime.tar.xz | awk '{print $1}')
          if [ "$actual_sha" != "$WASMTIME_SHA256" ]; then
            echo "wasmtime checksum mismatch: expected $WASMTIME_SHA256, got $actual_sha" >&2
            exit 1
          fi
          mkdir -p "$HOME/.wasmtime/bin"
          tar -xJf wasmtime.tar.xz --strip-components=1 -C "$HOME/.wasmtime/bin" \
            "wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime"
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: Smoke-test the .wasm
        run: |
          for f in test/corpus/01-*.fbs test/corpus/02-*.fbs; do
            echo "--- $f ---"
            wasmtime build/wasm/flatbuffers-format.wasm < "$f" > /dev/null
          done
          # Round-trip: native output must equal wasm output on the same input.
          for f in test/corpus/01-*.fbs; do
            wasm_out=$(wasmtime build/wasm/flatbuffers-format.wasm < "$f")
            native_out=$(node dist/src/cli.js "$f")
            if [ "$wasm_out" != "$native_out" ]; then
              echo "::error::wasm output diverges from native on $f"
              diff <(echo "$native_out") <(echo "$wasm_out") || true
              exit 1
            fi
          done
      - name: Emit SHA256 sidecar
        run: |
          set -euo pipefail
          cd build/wasm
          sha256sum flatbuffers-format.wasm > flatbuffers-format.wasm.sha256
          cat flatbuffers-format.wasm.sha256

      # SLSA build-provenance over both the .wasm and its sidecar —
      # see flatbuffers-native-binaries.yml for the verification flow.
      - name: Attest build provenance
        working-directory: ${{ github.workspace }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            projects/flatbuffers/flatbuffers-formatter/build/wasm/flatbuffers-format.wasm
            projects/flatbuffers/flatbuffers-formatter/build/wasm/flatbuffers-format.wasm.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: flatbuffers-format-wasm
          path: |
            projects/flatbuffers/flatbuffers-formatter/build/wasm/flatbuffers-format.wasm
            projects/flatbuffers/flatbuffers-formatter/build/wasm/flatbuffers-format.wasm.sha256
          if-no-files-found: error
          retention-days: 30

  upload-to-release:
    name: Upload .wasm to GitHub Release
    needs: build
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flatbuffers-format-wasm
          path: _wasm-artifact
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ steps.tag.outputs.value }}'
          case "$tag" in
            flatbuffers-format@*) ;;
            *) echo "Skipping: tag '$tag' is not a flatbuffers-format release"; exit 0 ;;
          esac
          gh release upload "$tag" \
            _wasm-artifact/flatbuffers-format.wasm \
            _wasm-artifact/flatbuffers-format.wasm.sha256 \
            --clobber \
            --repo "${{ github.repository }}"
