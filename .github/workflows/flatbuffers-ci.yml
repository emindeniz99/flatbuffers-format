name: flatbuffers-format CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The two unit-test jobs run on a 2-D matrix (OS x Node) so the published
  # package is verified cross-platform. `crosscheck` and `flatc-conform`
  # stay Linux-only on purpose — see comments on those jobs below. The
  # `flatbuffers-format-lint` job below uses Biome and only needs one
  # OS/Node combo (Biome's rules don't vary by platform).
  flatbuffers-format-lint:
    name: flatbuffers-format / lint (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Scoped to the two TypeScript packages this workflow tests. A
      # workspace-wide install would also compile tree-sitter-flatbuffers'
      # native binding, which this workflow never touches — and which
      # node-gyp cannot link on Windows + Node 26 (the LTO flag Node 26
      # passes is rejected by the runner's MSVC linker). That grammar has
      # its own workflow.
      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile --filter flatbuffers-format... --filter flatbuffers-format-handrolled...
      - name: Lint
        working-directory: .
        run: pnpm --filter flatbuffers-format lint

  flatbuffers-format-test:
    name: flatbuffers-format / ${{ matrix.os }} / node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # All currently-supported LTS lines plus the current release.
        # Node release cadence (as of October 2026): 20 = end of life
        # since Apr 2026; 22 = maintenance LTS until Apr 2027; 24 = LTS
        # until Apr 2028; 26 = LTS from late October 2026. Odd-numbered
        # (21/23/25) are short-lived (six-month EOL) — intentionally
        # skipped.
        # Starts at 22 because pnpm 11 requires >=22.13, not because 20 is
        # unsupported: `engines` allows >=20, and that floor is verified in
        # flatbuffers-pm-compat.yml, which installs the packed tarball with
        # npm on Node 20.
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Scoped to the two TypeScript packages this workflow tests. A
      # workspace-wide install would also compile tree-sitter-flatbuffers'
      # native binding, which this workflow never touches — and which
      # node-gyp cannot link on Windows + Node 26 (the LTO flag Node 26
      # passes is rejected by the runner's MSVC linker). That grammar has
      # its own workflow.
      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile --filter flatbuffers-format... --filter flatbuffers-format-handrolled...
      - name: Build
        working-directory: .
        run: pnpm --filter flatbuffers-format build
      - name: Test
        working-directory: .
        run: pnpm --filter flatbuffers-format test

  flatbuffers-format-handrolled-test:
    name: flatbuffers-format-handrolled / ${{ matrix.os }} / node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Starts at 22 because pnpm 11 requires >=22.13, not because 20 is
        # unsupported: `engines` allows >=20, and that floor is verified in
        # flatbuffers-pm-compat.yml, which installs the packed tarball with
        # npm on Node 20.
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Scoped to the two TypeScript packages this workflow tests. A
      # workspace-wide install would also compile tree-sitter-flatbuffers'
      # native binding, which this workflow never touches — and which
      # node-gyp cannot link on Windows + Node 26 (the LTO flag Node 26
      # passes is rejected by the runner's MSVC linker). That grammar has
      # its own workflow.
      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile --filter flatbuffers-format... --filter flatbuffers-format-handrolled...
      - name: Build
        working-directory: .
        run: pnpm --filter flatbuffers-format-handrolled build
      - name: Test
        working-directory: .
        run: pnpm --filter flatbuffers-format-handrolled test

  # Linux-only by design. crosscheck.sh is a bash script and wiring up bash
  # on Windows runners (or porting to PowerShell/Node) isn't worth it for a
  # differential oracle that already proves correctness on Linux. macOS would
  # work but adds runner minutes for no extra signal — the two engines are
  # platform-independent TypeScript.
  crosscheck:
    name: crosscheck (antlr vs hand-rolled, byte-identical)
    runs-on: ubuntu-latest
    needs: [flatbuffers-format-test, flatbuffers-format-handrolled-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Scoped to the two TypeScript packages this workflow tests. A
      # workspace-wide install would also compile tree-sitter-flatbuffers'
      # native binding, which this workflow never touches — and which
      # node-gyp cannot link on Windows + Node 26 (the LTO flag Node 26
      # passes is rejected by the runner's MSVC linker). That grammar has
      # its own workflow.
      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile --filter flatbuffers-format... --filter flatbuffers-format-handrolled...
      - name: Build both engines
        working-directory: .
        run: pnpm --filter flatbuffers-format --filter flatbuffers-format-handrolled build
      - name: Cross-check (byte-identical, idempotent)
        run: bash flatbuffers-formatter/test/crosscheck.sh

  # Linux-only by design. We download a known-good flatc binary
  # (Linux.flatc.binary.g++-13.zip) from the upstream release. Windows/macOS
  # binaries exist in the same release but pinning + caching three
  # OS-specific download paths is extra surface area for a corpus-validity
  # check that's platform-independent at the schema level.
  flatc-conform:
    name: flatc-conform (corpus accepted by upstream flatc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # ---------------------------------------------------------------------
      # flatc binary install — pinned tag + SHA256-verified download.
      #
      # Why pinned, not "latest": the previous version of this job resolved
      # `releases/latest` at run time and downloaded the asset without
      # verifying its SHA256. That made the test gate pass through whatever
      # the upstream tag pointed at on each run AND trusted the bytes
      # implicitly. A compromise of GitHub release infrastructure (or
      # someone successfully MITM-ing the runner) would silently land
      # arbitrary code in the CI environment. Pinning + checksum makes
      # both attacks observable: the SHA mismatch fails loudly.
      #
      # To bump:
      #   1. Pick a new tag from https://github.com/google/flatbuffers/releases
      #   2. curl -fsSL https://github.com/google/flatbuffers/releases/download/<tag>/Linux.flatc.binary.g++-13.zip | sha256sum
      #   3. Update FLATC_TAG and FLATC_SHA256 below in the same commit.
      # ---------------------------------------------------------------------
      - name: Set flatc pin
        id: flatc
        run: |
          # Update both values together when bumping flatc — see comment above.
          echo "tag=v25.12.19" >> "$GITHUB_OUTPUT"
          echo "sha256=9f87066dc5dfa7fe02090b55bab5f3e55df03e32c9b0cdf229004ade7d091039" >> "$GITHUB_OUTPUT"
      - name: Cache flatc binary
        id: flatc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/flatc
          key: flatc-linux-gcc-${{ steps.flatc.outputs.tag }}-${{ steps.flatc.outputs.sha256 }}
      - name: Download + verify flatc
        if: steps.flatc-cache.outputs.cache-hit != 'true'
        env:
          FLATC_TAG: ${{ steps.flatc.outputs.tag }}
          FLATC_SHA256: ${{ steps.flatc.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p tools/flatc
          tag="$FLATC_TAG"
          expected_sha="$FLATC_SHA256"
          url="https://github.com/google/flatbuffers/releases/download/${tag}/Linux.flatc.binary.g++-13.zip"
          echo "Downloading $url"
          curl -fsSL -o /tmp/flatc.zip "$url"
          actual_sha=$(sha256sum /tmp/flatc.zip | awk '{print $1}')
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::flatc zip SHA256 mismatch."
            echo "  expected: $expected_sha"
            echo "  actual:   $actual_sha"
            echo "  url:      $url"
            echo "If you intentionally bumped FLATC_TAG, update FLATC_SHA256 in the same commit."
            exit 1
          fi
          echo "flatc zip SHA256 verified: $actual_sha"
          unzip -o /tmp/flatc.zip -d tools/flatc
          chmod +x tools/flatc/flatc
      - name: Prepend flatc to PATH
        run: echo "${{ github.workspace }}/tools/flatc" >> "$GITHUB_PATH"
      - name: Verify flatc on PATH
        run: flatc --version
      # Scoped to the two TypeScript packages this workflow tests. A
      # workspace-wide install would also compile tree-sitter-flatbuffers'
      # native binding, which this workflow never touches — and which
      # node-gyp cannot link on Windows + Node 26 (the LTO flag Node 26
      # passes is rejected by the runner's MSVC linker). That grammar has
      # its own workflow.
      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile --filter flatbuffers-format... --filter flatbuffers-format-handrolled...
      - name: Build engine and oracle
        working-directory: .
        run: pnpm --filter flatbuffers-format --filter flatbuffers-format-handrolled build
      - name: flatc-conform
        run: bash flatbuffers-formatter/scripts/flatc-conform.sh
      # flatbuffers' own test schemas, at the commit of the flatc release
      # pinned above (tag v25.12.19): the syntax flatc really supports,
      # which our corpus only covers as far as we thought of it. Bump the
      # SHA with the flatc tag.
      - name: Check out flatbuffers' test schemas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: google/flatbuffers
          ref: 7e163021e59cca4f8e1e35a7c828b5c6b7915953 # v25.12.19
          path: _upstream-flatbuffers
          persist-credentials: false
          sparse-checkout: |
            tests
            samples
      - name: Format flatbuffers' test schemas (codegen must not change)
        run: bash flatbuffers-formatter/scripts/upstream-schemas.sh _upstream-flatbuffers
