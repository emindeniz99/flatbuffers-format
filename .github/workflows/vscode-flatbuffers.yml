name: vscode-flatbuffers CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches: [main]

jobs:
  vscode-flatbuffers-test:
    name: vscode-flatbuffers / node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install (workspace)
        run: pnpm install --frozen-lockfile
      - name: Build engine + extension
        run: pnpm --filter flatbuffers-format --filter vscode-flatbuffers build
      - name: Test
        run: pnpm --filter vscode-flatbuffers test
