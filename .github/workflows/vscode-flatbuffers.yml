name: vscode-flatbuffers CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vscode-flatbuffers-test:
    name: vscode-flatbuffers / node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Starts at 22 because pnpm 11 requires >=22.13, not because 20 is
        # unsupported: `engines` allows >=20, and that floor is verified in
        # flatbuffers-pm-compat.yml, which installs the packed tarball with
        # npm on Node 20.
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install (workspace)
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Build engine + extension
        working-directory: .
        run: pnpm --filter flatbuffers-format --filter vscode-flatbuffers build
      - name: Test
        working-directory: .
        run: pnpm --filter vscode-flatbuffers test
