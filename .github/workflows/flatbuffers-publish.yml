name: flatbuffers-format publish (dry-run)

# Manual-only sanity check. Real publishes are now driven by
# `release-please.yml` — that workflow opens a release PR for any
# Conventional Commits on `main`, then `npm publish --provenance`es on
# merge. This file stays around as an on-demand "show me what the
# tarball would look like" tool: it runs the full `prepublishOnly`
# chain and `npm publish --dry-run` without ever touching the registry.
# Trigger it from the Actions tab whenever you want to inspect the
# packaged artifact without cutting a release.

on:
  workflow_dispatch:

jobs:
  dry-run:
    name: build + test + npm publish --dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/flatbuffers-formatter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/flatbuffers-formatter/package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Build sibling (handrolled) for crosscheck
        working-directory: projects/flatbuffers/flatbuffers-formatter-handrolled
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Cross-check
        run: bash test/crosscheck.sh
      - name: npm publish --dry-run
        run: npm publish --dry-run
      - name: List tarball contents
        run: npm pack --dry-run
