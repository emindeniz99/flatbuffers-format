name: flatbuffers-format publish (dry-run)

# Manual-only sanity check. Real publishes are now driven by
# `release-please.yml` — that workflow opens a release PR for any
# Conventional Commits on `main`, then `pnpm publish --provenance`es on
# merge. This file stays around as an on-demand "show me what the
# tarball would look like" tool: it runs the full prepublishOnly chain
# and `pnpm publish --dry-run` without ever touching the registry.
# Trigger it from the Actions tab whenever you want to inspect the
# packaged artifact without cutting a release.

on:
  workflow_dispatch:

# Nothing here writes: the job builds, tests and `--dry-run`s. Read-only
# is all it needs.
permissions:
  contents: read

jobs:
  dry-run:
    name: build + test + pnpm publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Build engine + handrolled (for crosscheck)
        working-directory: .
        run: pnpm --filter flatbuffers-format --filter flatbuffers-format-handrolled build
      - name: Test engine
        working-directory: .
        run: pnpm --filter flatbuffers-format test
      - name: Cross-check
        run: bash flatbuffers-formatter/test/crosscheck.sh
      - name: pnpm publish --dry-run
        working-directory: .
        run: pnpm --filter flatbuffers-format publish --dry-run --no-git-checks --provenance --access public
      - name: List tarball contents
        working-directory: flatbuffers-formatter
        run: pnpm pack --pack-destination /tmp/pack && tar -tzf /tmp/pack/*.tgz | sort
