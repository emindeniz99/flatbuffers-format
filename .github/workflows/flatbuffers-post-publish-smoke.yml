name: post-publish smoke

# Verifies each just-published artifact actually installs from its registry
# and works end-to-end. Catches the class of bugs the pre-publish gate
# can't — e.g. our file: → ^X.Y.Z rewrite path producing a tarball that
# resolves wrong on a clean machine, or vsce/ovsx ingesting a corrupt
# .vsix. Triggered automatically when release-please completes, plus a
# manual workflow_dispatch with per-package version inputs so the
# maintainer can re-smoke any version.
#
# Failure semantics: a smoke job failing means the publish succeeded but
# the artifact is broken. Rollback by running
#   npm deprecate <pkg>@<version> "broken; use next release"
# and pushing a fix as a new release.
#
# On the `workflow_run` trigger (zizmor flags it by default, and rightly
# so in general — it runs privileged, in the base-repo context). The
# three things that make it dangerous are all absent here:
#   1. The upstream workflow can't be started by an untrusted actor.
#      release-please.yml triggers only on `push` to main and
#      workflow_dispatch, so a fork PR cannot induce this run.
#   2. No job checks out attacker-controlled code — checkout takes the
#      default ref, never `github.event.workflow_run.head_sha`.
#   3. No job needs a token or a secret: permissions are `contents:
#      read` and every job only reads public registries.
# Revisit this suppression if any of those three stops being true.

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["release-please"]
    types: [completed]
  workflow_dispatch:
    inputs:
      flatbuffers_format_version:
        description: "flatbuffers-format version to smoke (blank = read from manifest)"
        required: false
      prettier_plugin_version:
        description: "prettier-plugin-flatbuffers version to smoke (blank = read from manifest)"
        required: false
      tree_sitter_version:
        description: "tree-sitter-flatbuffers version to smoke (blank = read from manifest)"
        required: false
      vscode_extension_version:
        description: "vscode-flatbuffers version to smoke (blank = read from manifest)"
        required: false

permissions:
  contents: read

jobs:
  smoke-flatbuffers-format:
    # Matrix over package managers. The published artefact is the
    # same regardless — what changes is the install algorithm
    # (resolution, hoisting, lockfile, peer-dep handling). Catching
    # "publish succeeded but installs break under PM X" the moment
    # it happens, not weeks later when a user reports it.
    name: smoke / flatbuffers-format / ${{ matrix.pm }}
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm, yarn-classic, yarn-berry, bun]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Setup pnpm
        if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
          run_install: false
      - name: Setup Yarn Classic (v1) # zizmor: ignore[adhoc-packages]
        if: matrix.pm == 'yarn-classic'
        run: npm install -g yarn@1.22.22
      - name: Setup Yarn Berry (v4) # zizmor: ignore[adhoc-packages]
        if: matrix.pm == 'yarn-berry'
        run: npm install -g yarn@1.22.22
      - name: Setup Bun
        if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # Every `${{ }}` that carries a caller-supplied value is bound to an
      # env var rather than pasted into the shell source — `inputs.*` on a
      # workflow_dispatch is an arbitrary string typed by whoever triggers
      # the run. Same treatment in the three sibling jobs below.
      - name: Resolve target version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.flatbuffers_format_version }}
          PM: ${{ matrix.pm }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            v="$INPUT_VERSION"
          else
            v=$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["flatbuffers-formatter"])' 2>/dev/null || echo "")
          fi
          if [ -z "$v" ]; then
            echo "No version to smoke (manifest missing or input empty); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "Target: flatbuffers-format@$v via $PM"
          fi

      - name: Wait for npm propagation (up to 90s)
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          v="$VERSION"
          for i in 1 2 3 4 5 6 7 8 9; do
            actual=$(npm view "flatbuffers-format@$v" version 2>/dev/null || echo "")
            if [ "$actual" = "$v" ]; then
              echo "Registry sees flatbuffers-format@$v ✓"
              exit 0
            fi
            echo "Not yet on registry (try $i/9). Sleeping 10s."
            sleep 10
          done
          echo "::error::flatbuffers-format@$v not found on registry after 90s — publish likely failed."
          exit 1

      # `npm/pnpm/yarn/bun add flatbuffers-format@$v` from the public
      # registry IS the thing under test — this job exists to prove the
      # freshly-published tarball installs. Pinning to a lockfile here
      # would test nothing.
      - name: Install scoped to a scratch consumer + smoke # zizmor: ignore[adhoc-packages]
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PM: ${{ matrix.pm }}
        run: |
          set -eux
          v="$VERSION"
          mkdir consumer && cd consumer
          # Hand-rolled ESM package.json — avoids each PM's `init`
          # quirks (notably bun's `init -y` creates a subdirectory
          # rather than initialising in cwd).
          cat > package.json <<'JSON'
          { "name": "consumer", "version": "0.0.0", "private": true, "type": "module" }
          JSON

          case "$PM" in
            npm)
              npm install --no-audit --no-fund "flatbuffers-format@$v"
              bin=node_modules/.bin/flatbuffers-format
              ;;
            pnpm)
              pnpm add "flatbuffers-format@$v"
              bin=node_modules/.bin/flatbuffers-format
              ;;
            yarn-classic)
              yarn add "flatbuffers-format@$v"
              bin=node_modules/.bin/flatbuffers-format
              ;;
            yarn-berry)
              yarn set version berry
              # Berry's PnP linker hides `node_modules/.bin/`; force
              # node-modules linker to mirror npm semantics for the
              # CLI invocation. The PnP-compat angle is exercised by
              # the dedicated flatbuffers-pm-compat.yml workflow.
              echo "nodeLinker: node-modules" > .yarnrc.yml
              yarn add "flatbuffers-format@$v"
              bin=node_modules/.bin/flatbuffers-format
              ;;
            bun)
              bun add "flatbuffers-format@$v"
              bin=node_modules/.bin/flatbuffers-format
              ;;
          esac

          # CLI: --version must match the version we just installed.
          got=$("$bin" --version | awk '{print $2}')
          if [ "$got" != "$v" ]; then
            echo "::error::CLI --version mismatch under $PM: got '$got', expected '$v'"
            exit 1
          fi

          # CLI: read .fbs from stdin, write formatted to stdout.
          out=$(printf 'table T{x:int;}\n' | "$bin" -)
          expected=$'table T { x: int; }\n'
          if [ "$out" != "$expected" ]; then
            echo "::error::Canonical-output mismatch under $PM"
            diff <(printf '%s' "$out") <(printf '%s' "$expected") || true
            exit 1
          fi

          # Programmatic API: import + call format().
          cat > smoke.mjs <<'EOF'
          import { format, check } from "flatbuffers-format";
          const out = format("namespace X;\ntable T{x:int;y:string;}");
          if (!out.includes("table T")) throw new Error("Bad output: " + out);
          if (format(out) !== out) throw new Error("format() not idempotent");
          if (check(out) !== true) throw new Error("check() rejected formatted output");
          console.log("API OK:", out.length, "bytes");
          EOF
          node smoke.mjs

          echo "✓ flatbuffers-format@$v installs + formats + API works under $PM"

  smoke-prettier-plugin-flatbuffers:
    name: smoke / prettier-plugin-flatbuffers
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Resolve target versions
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.prettier_plugin_version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            v="$INPUT_VERSION"
            engine="$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["flatbuffers-formatter"])' 2>/dev/null || echo "")"
          else
            v="$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["prettier-plugin-flatbuffers"])' 2>/dev/null || echo "")"
            engine="$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["flatbuffers-formatter"])' 2>/dev/null || echo "")"
          fi
          if [ -z "$v" ] || [ -z "$engine" ]; then
            echo "Missing plugin or engine version; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "engine=$engine" >> "$GITHUB_OUTPUT"
            echo "Target: prettier-plugin-flatbuffers@$v + flatbuffers-format@$engine"
          fi
      - name: Wait for npm propagation
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          v="$VERSION"
          for i in 1 2 3 4 5 6 7 8 9; do
            actual=$(npm view "prettier-plugin-flatbuffers@$v" version 2>/dev/null || echo "")
            if [ "$actual" = "$v" ]; then
              echo "Registry sees prettier-plugin-flatbuffers@$v ✓"
              exit 0
            fi
            sleep 10
          done
          echo "::error::prettier-plugin-flatbuffers@$v not on registry after 90s."
          exit 1
      # Installing the just-published plugin + engine straight from the
      # registry is the point of this job.
      - name: Install + Prettier-format smoke # zizmor: ignore[adhoc-packages]
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ENGINE: ${{ steps.ver.outputs.engine }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm i --no-audit --no-fund prettier \
            "prettier-plugin-flatbuffers@$VERSION" \
            "flatbuffers-format@$ENGINE"
          echo '{ "plugins": ["prettier-plugin-flatbuffers"] }' > .prettierrc
          printf 'table T{x:int;}\n' > ugly.fbs
          # --check on unformatted exits non-zero
          if npx prettier --check ugly.fbs >/dev/null 2>&1; then
            echo "::error::Prettier --check returned 0 on unformatted input — plugin didn't engage"
            exit 1
          fi
          npx prettier --write ugly.fbs >/dev/null
          got=$(cat ugly.fbs)
          expected=$'table T { x: int; }\n'
          if [ "$got" != "$expected" ]; then
            echo "::error::Prettier-formatted output != canonical"
            diff <(printf '%s' "$got") <(printf '%s' "$expected") || true
            exit 1
          fi
          echo "✓ prettier-plugin-flatbuffers@$VERSION engages and formats cleanly."

  smoke-tree-sitter-flatbuffers:
    name: smoke / tree-sitter-flatbuffers
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Resolve target version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.tree_sitter_version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            v="$INPUT_VERSION"
          else
            v="$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["tree-sitter-flatbuffers"])' 2>/dev/null || echo "")"
          fi
          if [ -z "$v" ]; then
            echo "No version to smoke; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$v" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for npm propagation
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          v="$VERSION"
          for i in 1 2 3 4 5 6 7 8 9; do
            actual=$(npm view "tree-sitter-flatbuffers@$v" version 2>/dev/null || echo "")
            if [ "$actual" = "$v" ]; then
              echo "Registry sees tree-sitter-flatbuffers@$v ✓"
              exit 0
            fi
            sleep 10
          done
          echo "::error::tree-sitter-flatbuffers@$v not on registry after 90s."
          exit 1
      # Installing the just-published grammar straight from the registry
      # is the point of this job.
      - name: Install + parse smoke # zizmor: ignore[adhoc-packages]
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ts-smoke && cd /tmp/ts-smoke
          npm init -y >/dev/null
          # node-gyp build happens during install of tree-sitter-flatbuffers.
          npm i --no-audit --no-fund tree-sitter \
            "tree-sitter-flatbuffers@$VERSION"
          cat > smoke.cjs <<'JS'
          const Parser = require("tree-sitter");
          const Fbs = require("tree-sitter-flatbuffers");
          const p = new Parser();
          p.setLanguage(Fbs);
          const src = "namespace A.B;\ntable T { x: int; }\n";
          const tree = p.parse(src);
          let errors = 0;
          (function walk(n) {
            if (n.type === "ERROR" || n.isMissing) errors++;
            for (let i = 0; i < n.namedChildCount; i++) walk(n.namedChild(i));
          })(tree.rootNode);
          if (errors > 0) {
            console.error("tree-sitter parse produced " + errors + " ERROR/MISSING node(s)");
            console.error(tree.rootNode.toString());
            process.exit(1);
          }
          console.log("✓ tree-sitter-flatbuffers parsed cleanly, " + tree.rootNode.namedChildCount + " top-level decls");
          JS
          node smoke.cjs

  smoke-vscode-flatbuffers:
    name: smoke / vscode-flatbuffers
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Resolve target version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.vscode_extension_version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            v="$INPUT_VERSION"
          else
            v="$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["vscode-flatbuffers"])' 2>/dev/null || echo "")"
          fi
          if [ -z "$v" ]; then
            echo "No version to smoke; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$v" >> "$GITHUB_OUTPUT"
          fi
      - name: Marketplace listing check
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          v="$VERSION"
          # vsce show returns JSON with a versions[] sorted newest-first.
          for i in 1 2 3 4 5 6 7 8 9; do
            latest=$(npx --yes @vscode/vsce show emindeniz99.vscode-flatbuffers --json 2>/dev/null \
                     | python3 -c 'import json, sys; d=json.load(sys.stdin); print(d["versions"][0]["version"]) if d.get("versions") else print("")' \
                     || echo "")
            if [ "$latest" = "$v" ]; then
              echo "✓ Marketplace lists emindeniz99.vscode-flatbuffers@$v"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Marketplace doesn't list emindeniz99.vscode-flatbuffers@$v after ~135s. vsce publish may have failed."
          exit 1
      - name: Open VSX listing check (best-effort)
        if: steps.ver.outputs.skip != 'true'
        continue-on-error: true
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          v="$VERSION"
          # Open VSX may have been skipped (no OVSX_PAT, namespace not registered).
          # Don't fail the workflow on a missing listing.
          for i in 1 2 3; do
            latest=$(npx --yes ovsx get emindeniz99.vscode-flatbuffers --metadata 2>/dev/null \
                     | python3 -c 'import json, sys; d=json.load(sys.stdin); print(d.get("version", ""))' \
                     || echo "")
            if [ "$latest" = "$v" ]; then
              echo "✓ Open VSX lists emindeniz99.vscode-flatbuffers@$v"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Open VSX doesn't list version $v (may be intentional if OVSX_PAT not set)."
