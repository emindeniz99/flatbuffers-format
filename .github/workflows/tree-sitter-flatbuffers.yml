name: tree-sitter-flatbuffers CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tree-sitter-flatbuffers-test:
    name: tree-sitter-flatbuffers / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile
      # Regenerate the parser from grammar.js to make sure the committed
      # src/parser.c matches the source. If it diverges, `tree-sitter
      # generate` will silently overwrite it; the test suite then runs
      # on the freshly-generated parser.
      - name: Generate
        working-directory: .
        run: pnpm --filter tree-sitter-flatbuffers generate
      - name: Test
        working-directory: .
        run: pnpm --filter tree-sitter-flatbuffers test

  # The suite above drives the tree-sitter CLI, which never loads the Node
  # binding — so it stayed green while the published package was unusable
  # from Node (the binding shipped an untagged N-API External and every
  # `parser.setLanguage()` threw "Invalid language object"). This job
  # exercises what consumers actually get: the packed tarball, installed
  # into a throwaway project outside the workspace, parsed via the real
  # `tree-sitter` runtime. Node 20 is the `engines` floor and can only be
  # checked here: the workspace steps need pnpm 11, which requires Node
  # >=22.13, so the tarball is packed on 22 and then installed and loaded
  # on the matrix version. Node 20 is end of life since April 2026; it
  # stays supported, and tested, until 2027.
  tree-sitter-flatbuffers-consumer:
    name: tree-sitter-flatbuffers / node binding (packed tarball, node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Pack the tarball
        run: pnpm --filter tree-sitter-flatbuffers pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      # Deliberately outside the workspace: inside it, pnpm would link the
      # source directory and the packaged artifact would never be tested.
      - name: Install into a clean consumer and parse # zizmor: ignore[adhoc-packages]
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init -y >/dev/null
          npm install --no-audit --no-fund tree-sitter "$RUNNER_TEMP"/tree-sitter-flatbuffers-*.tgz
          cat > parse.cjs <<'EOF'
          const Parser = require("tree-sitter");
          const FlatBuffers = require("tree-sitter-flatbuffers");
          const parser = new Parser();
          parser.setLanguage(FlatBuffers);
          const tree = parser.parse("table Monster { hp: short = 100; name: string; }\n");
          const sexp = tree.rootNode.toString();
          if (tree.rootNode.type !== "source_file") {
            throw new Error(`unexpected root node: ${tree.rootNode.type}`);
          }
          if (sexp.includes("ERROR") || sexp.includes("MISSING")) {
            throw new Error(`parse produced ERROR/MISSING nodes: ${sexp}`);
          }
          console.log("parsed from the packed tarball:", sexp.slice(0, 80));
          EOF
          node parse.cjs
