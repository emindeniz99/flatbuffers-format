name: tree-sitter-flatbuffers CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches: [main]

jobs:
  tree-sitter-flatbuffers-test:
    name: tree-sitter-flatbuffers / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/tree-sitter-flatbuffers/package-lock.json
      - name: Install
        working-directory: projects/tree-sitter-flatbuffers
        run: npm ci --no-audit --no-fund
      # Regenerate the parser from grammar.js to make sure the committed
      # src/parser.c matches the source. If it diverges, `tree-sitter
      # generate` will silently overwrite it; the test suite then runs
      # on the freshly-generated parser.
      - name: Generate
        working-directory: projects/tree-sitter-flatbuffers
        run: npm run generate
      - name: Test
        working-directory: projects/tree-sitter-flatbuffers
        run: npm test
