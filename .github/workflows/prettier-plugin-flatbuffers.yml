name: prettier-plugin-flatbuffers CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prettier-plugin-flatbuffers-test:
    name: prettier-plugin-flatbuffers / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install (workspace, hoists the workspace:^ engine dep)
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Build engine + plugin
        working-directory: .
        run: pnpm --filter flatbuffers-format --filter prettier-plugin-flatbuffers build
      - name: Test
        working-directory: .
        run: pnpm --filter prettier-plugin-flatbuffers test
