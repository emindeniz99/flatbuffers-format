name: prettier-plugin-flatbuffers CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prettier-plugin-flatbuffers-test:
    name: prettier-plugin-flatbuffers / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install (workspace, hoists the workspace:^ engine dep)
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Build engine + plugin
        working-directory: .
        run: pnpm --filter flatbuffers-format --filter prettier-plugin-flatbuffers build
      - name: Test
        working-directory: .
        run: pnpm --filter prettier-plugin-flatbuffers test
