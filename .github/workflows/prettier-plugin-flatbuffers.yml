name: prettier-plugin-flatbuffers CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches: [main]

jobs:
  prettier-plugin-flatbuffers-test:
    name: prettier-plugin-flatbuffers / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install (workspace, hoists the workspace:^ engine dep)
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Build engine + plugin
        working-directory: .
        run: pnpm --filter flatbuffers-format --filter prettier-plugin-flatbuffers build
      - name: Test
        working-directory: .
        run: pnpm --filter prettier-plugin-flatbuffers test
